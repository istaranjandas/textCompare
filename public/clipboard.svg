<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" fill="#000000"/>
  
  <!-- Shadow effect -->
  <path d="M8 8 L8 26 L24 26 L24 8 Z" fill="#1a1a1a" opacity="0.5"/>
  
  <!-- Main clipboard body -->
  <rect x="7" y="7" width="18" height="21" rx="1.5" fill="#FFFFFF"/>
  
  <!-- Clipboard clip -->
  <rect x="11" y="4" width="10" height="5" rx="1.5" fill="#000000"/>
  <rect x="12" y="5" width="8" height="3" rx="1" fill="#333333"/>
  
  <!-- Document lines -->
  <line x1="10" y1="12" x2="22" y2="12" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="15" x2="22" y2="15" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="18" x2="22" y2="18" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="10" y1="21" x2="18" y2="21" stroke="#000000" stroke-width="0.8" stroke-linecap="round"/>
  
  <!-- Diff indicator (subtle) -->
  <circle cx="20" cy="21" r="1.5" fill="#000000"/>
</svg>
